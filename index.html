<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Certivo</title>
<meta name="description" content="資格学習を楽しく続けられる学習アプリ。間隔反復とゲーム要素で、1日10分から。">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1922" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Certivo">
<style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600&family=JetBrains+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* Layout: one calm column (max 720px). Header with three tabs; study sessions take over the column with a sticky action bar at the bottom. */
:root {
  --bg: #f6f5f9;
  --surface: #ffffff;
  --surface-2: #f1eff6;
  --ink: #18161f;
  --muted: #6a6778;
  --line: #e4e1ec;
  --accent: #6a4fd3;
  --accent-ink: #ffffff;
  --accent-soft: #eeeafb;
  --good: #1d855a;
  --good-soft: #e5f4ec;
  --bad: #c03d36;
  --bad-soft: #fbeceb;
  --warn: #a8701a;
  --warn-soft: #fbf2e1;
  --shadow: 0 1px 2px rgba(24, 22, 31, .05), 0 4px 16px rgba(24, 22, 31, .04);
  --font-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121118; --surface: #1a1922; --surface-2: #22202c; --ink: #ecebf3; --muted: #9a97a9; --line: #2c2a37;
    --accent: #a58ff3; --accent-ink: #15131c; --accent-soft: #2a2443; --good: #4cc38a; --good-soft: #17301f;
    --bad: #f0766c; --bad-soft: #3a1c1a; --warn: #e2b34a; --warn-soft: #33290f;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121118; --surface: #1a1922; --surface-2: #22202c; --ink: #ecebf3; --muted: #9a97a9; --line: #2c2a37;
  --accent: #a58ff3; --accent-ink: #15131c; --accent-soft: #2a2443; --good: #4cc38a; --good-soft: #17301f;
  --bad: #f0766c; --bad-soft: #3a1c1a; --warn: #e2b34a; --warn-soft: #33290f;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.7; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 720px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 18px; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand-mark { width: 22px; height: 22px; border-radius: 6px; background: var(--accent); display: grid; place-items: center; color: var(--accent-ink); font-size: 12px; font-family: var(--font-num); }
.tabs { display: flex; gap: 2px; margin-left: auto; background: var(--surface-2); border-radius: 9px; padding: 3px; }
.tab { border: 0; background: transparent; padding: 5px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); font-weight: 500; }
.tab[aria-current="page"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.sync { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; width: 100%; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--good); }

/* page */
main { max-width: 720px; margin: 0 auto; padding-block: 20px 120px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 700; margin: 0; text-wrap: balance; line-height: 1.35; }
h1 { font-size: 22px; }
h2 { font-size: 17px; }
h3 { font-size: 15px; }
p { margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.eyebrow { font-size: 11.5px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.spread { justify-content: space-between; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 9px; padding: 9px 14px; font-weight: 500; font-size: 14px; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 13px; }
.btn.wide { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-weight: 500; white-space: nowrap; }
.chip.accent { background: var(--accent-soft); color: var(--accent); }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.bad { background: var(--bad-soft); color: var(--bad); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.bar { height: 6px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.bar.good > i { background: var(--good); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--muted); min-width: 0; }
.input { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; background: var(--surface); min-height: 40px; width: 100%; color: var(--ink); }
textarea.input { min-height: 72px; resize: vertical; }

/* stat strip */
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.stat { background: var(--surface); padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat b { font-family: var(--font-num); font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; color: var(--muted); }
@media (max-width: 480px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* quests */
.quest { display: grid; grid-template-columns: 22px 1fr auto; gap: 10px; align-items: center; }
.check { width: 20px; height: 20px; border-radius: 6px; border: 1.5px solid var(--line); display: grid; place-items: center; font-size: 12px; }
.check.done { background: var(--good); border-color: var(--good); color: #fff; }

/* map */
.area { display: flex; flex-direction: column; gap: 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.area-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
.stages { display: flex; flex-wrap: wrap; gap: 12px 6px; align-items: flex-start; position: relative; }
.stage { border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 104px; padding: 4px 2px; border-radius: 10px; }
.stage:hover { background: var(--surface-2); }
.ring { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
.ring > span { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; font-weight: 600; }
.ring.master { background: conic-gradient(var(--good) 100%, var(--good) 0); }
.ring.master > span { color: var(--good); }
.stage-name { font-size: 11.5px; line-height: 1.4; text-align: center; color: var(--ink); }
.connector { flex: none; width: 10px; height: 2px; background: var(--line); margin-top: 27px; }
@media (max-width: 480px) { .stage { width: 92px; } .connector { display: none; } }

/* quiz */
.qhead { display: flex; align-items: center; gap: 10px; }
.qhead .bar { flex: 1; }
.combo { font-family: var(--font-num); font-size: 12px; font-weight: 600; color: var(--accent); min-width: 64px; text-align: right; }
.combo.pop { animation: pop .3s ease; }
@keyframes pop { 50% { transform: scale(1.18); } }
.stem { font-size: 16.5px; line-height: 1.75; font-weight: 500; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; min-height: 52px; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .key { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-num); font-size: 12px; color: var(--muted); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .key { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.right .key { background: var(--good); color: #fff; border-color: var(--good); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .key { background: var(--bad); color: #fff; border-color: var(--bad); }
.opt:disabled { cursor: default; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; padding: 2px; background: var(--surface-2); }
.seg button { border: 0; background: transparent; padding: 4px 12px; border-radius: 7px; font-size: 13px; color: var(--muted); min-height: 32px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 600; }
.verdict { display: flex; align-items: center; gap: 8px; font-family: var(--font-display); font-weight: 700; font-size: 17px; }
.verdict.good { color: var(--good); }
.verdict.bad { color: var(--bad); }
.why { display: grid; grid-template-columns: 26px 1fr; gap: 8px; font-size: 13.5px; }
.why .key { width: 22px; height: 22px; border-radius: 6px; border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--font-num); font-size: 11px; color: var(--muted); }
.src { font-size: 13px; display: flex; flex-direction: column; gap: 4px; }
.src a { overflow-wrap: anywhere; }
.ai-box { border: 1px dashed var(--accent); border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.ai-out { white-space: pre-wrap; font-size: 14px; line-height: 1.75; }
.actionbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 15; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.actionbar-in { max-width: 720px; margin: 0 auto; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; gap: 10px; align-items: center; }
.actionbar-in .btn.primary { flex: 1; }
.kbd { font-family: var(--font-num); font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; color: var(--muted); }

/* certs */
.cert { display: flex; flex-direction: column; gap: 10px; }
.cert-title { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.code { font-family: var(--font-num); font-weight: 600; font-size: 13px; color: var(--accent); }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }

/* progress */
.domain-row { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 4px 12px; align-items: center; }
.heat { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; max-width: 280px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--surface-2); display: block; max-width: 100%; }
.heat i.l1 { background: color-mix(in srgb, var(--accent) 30%, var(--surface-2)); }
.heat i.l2 { background: color-mix(in srgb, var(--accent) 60%, var(--surface-2)); }
.heat i.l3 { background: var(--accent); }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.badge { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.badge b { font-size: 13px; }
.badge span { font-size: 11.5px; color: var(--muted); }
.badge.locked { opacity: .45; border-style: dashed; }
.badge.earned { border-color: var(--accent); background: var(--accent-soft); }

/* result */
.big { font-family: var(--font-num); font-size: 40px; font-weight: 600; line-height: 1.1; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 40; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 13.5px; max-width: calc(100% - 32px); box-shadow: var(--shadow); }
.card-sec { display: grid; grid-template-columns: 88px 1fr; gap: 6px 14px; }
@media (max-width: 480px) { .card-sec { grid-template-columns: 1fr; } }
.card-sec dt { font-size: 12px; color: var(--muted); font-weight: 600; padding-top: 2px; }
.card-sec dd { margin: 0; }
.tip { border-left: 3px solid var(--accent); padding: 8px 12px; background: var(--accent-soft); border-radius: 0 8px 8px 0; font-size: 14px; }
.install { margin-left: 8px; }
.backup { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { text-align: center; padding: 28px 16px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><span class="brand-mark" aria-hidden="true">C</span>Certivo</div>
    <nav class="tabs" aria-label="画面の切り替え">
      <button class="tab" id="tab-certs" data-view="certs">マイ資格</button>
      <button class="tab" id="tab-home" data-view="home">学習</button>
      <button class="tab" id="tab-progress" data-view="progress">進捗</button>
    </nav>
    <button class="btn small install" id="install" hidden>アプリをインストール</button>
    <div class="sync" id="sync"><span class="dot"></span><span>読み込み中</span></div>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<div id="bar"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
  "use strict";

  /* ---------- small helpers ---------- */
  const $ = (s) => document.querySelector(s);
  function h(tag, attrs, ...kids) {
    const el = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "style") el.setAttribute("style", v);
      else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "text") el.textContent = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const kid of kids.flat()) {
      if (kid == null || kid === false) continue;
      el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
    }
    return el;
  }
  const pad = (n) => String(n).padStart(2, "0");
  const ymd = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => ymd(new Date());
  const toUTC = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
  const dayDiff = (a, b) => Math.round((toUTC(b) - toUTC(a)) / 864e5);
  const addDays = (s, n) => { const t = new Date(toUTC(s) + n * 864e5); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
  const weekKey = (s) => { const t = new Date(toUTC(s)); const dow = (t.getUTCDay() + 6) % 7; return addDays(s, -dow); };
  const shuffle = (a) => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const fmtDate = (s) => { if (!s) return "未設定"; const [y, m, d] = s.split("-"); return `${y}年${Number(m)}月${Number(d)}日`; };
  let toastTimer = null;
  function toast(msg) {
    const t = $("#toast"); t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.hidden = true; }, 2800);
  }

  /* ---------- storage: this device (localStorage); Store.connect is the hook for server sync ---------- */
  const LS = {
    get(k) { try { const v = localStorage.getItem("certivo:" + k); return v ? JSON.parse(v) : null; } catch { return null; } },
    set(k, v) { try { localStorage.setItem("certivo:" + k, JSON.stringify(v)); } catch { /* storage blocked */ } },
  };
  const Store = {
    db: null, uid: null, synced: false, pending: new Map(), writing: new Map(),
    async connect() {
      // Standalone build: progress lives on this device. Plug a backend (e.g. Supabase) in here later:
      // set this.db (collection(path).doc(key).get/set) and this.uid, then return true.
      return false;
    },
    ref(key) { return this.db.collection("data/users/" + this.uid).doc(key); },
    async loadRemote(key) {
      if (!this.synced) return null;
      try { const s = await this.ref(key).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; }
      catch { return null; }
    },
    save(key, obj) {
      obj.updatedAt = Date.now();
      LS.set(key, obj);
      if (!this.synced) return;
      this.pending.set(key, obj);
      clearTimeout(this["t_" + key]);
      this["t_" + key] = setTimeout(() => this.flush(key), 900);
    },
    async flush(key) {
      if (this.writing.get(key)) { this["t_" + key] = setTimeout(() => this.flush(key), 400); return; }
      const obj = this.pending.get(key); if (!obj) return;
      this.pending.delete(key); this.writing.set(key, true);
      try { await this.ref(key).set(JSON.parse(JSON.stringify(obj))); }
      catch (e) {
        if (e && e.code === "unavailable") { this.pending.set(key, obj); setTimeout(() => this.flush(key), 1500 + Math.random() * 1000); }
        else if (e && e.code === "quota_exceeded") toast("保存容量の上限に達しました。");
      }
      finally { this.writing.set(key, false); }
    },
  };

  /* ---------- state ---------- */
  const DEFAULT_GOAL = 10;
  const INTERVALS = [0, 1, 3, 7, 16, 35];
  const state = {
    registry: null, packs: {}, profile: null, prog: {},
    view: "certs", certId: "ai-103", session: null, topicId: null, lastResult: null, ready: false,
  };
  const newProfile = () => ({
    certs: [{ uid: "c-ai-103", certId: "ai-103", name: "Azure AI Apps and Agents Developer Associate", code: "AI-103", status: "studying", examDate: "", acquiredAt: "", expiresAt: "" }],
    settings: { dailyGoal: DEFAULT_GOAL },
  });

  function newer(a, b) { if (!a) return b; if (!b) return a; return (b.updatedAt || 0) > (a.updatedAt || 0) ? b : a; }

  /* AI tutor (server-side Claude API via /api/tutor; grounded on the verified explanation only).
     All AI calls go through callTutor so the provider can be swapped in one place. */
  let sampleFn = undefined;
  async function callTutor(prompt, { signal, onText }) {
    const res = await fetch("api/tutor", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ prompt }), signal });
    if (res.status === 404 || res.status === 501 || res.status === 503) { const e = new Error("unavailable"); e.code = "capability_disabled"; throw e; }
    if (res.status === 429) { const e = new Error("rate"); e.code = "rate_limited"; throw e; }
    if (!res.ok || !res.body) { const e = new Error("failed"); e.code = "failed"; throw e; }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let text = "";
    for (;;) { const { done, value } = await reader.read(); if (done) break; text += dec.decode(value, { stream: true }); onText && onText({ text }); }
    return { text, truncated: false };
  }
  async function getSample() {
    if (sampleFn !== undefined) return sampleFn;
    if (!navigator.onLine) return null;
    try { const r = await fetch("api/tutor", { method: "GET" }); sampleFn = r.ok ? callTutor : null; } catch { sampleFn = null; }
    return sampleFn;
  }

        mine: `私は ${r.selected.join(", ")} を選びました。私の選択のどこが考え違いだったのか、どう考えれば正解にたどり着けたかを説明してください。`,
      };

  function finishSession() {

    if (total) award(pr, "first", result.badges);
    if (s.kind === "boss" && total) {
      result.bossWon = correct >= 4;
      if (result.bossWon) { pr.bosses[s.domainId] = today(); award(pr, "boss-" + s.domainId, result.badges); }
    }
    if (s.kind === "mock" && total) {
      const unanswered = s.queue.length - total;
      result.score = Math.round((correct / s.queue.length) * 1000);
      result.unanswered = unanswered;
      result.byDomain = pk.domains.map((d) => { const rs = s.results.filter((r) => domainOf(pk, pk.qById[r.qid]) === d.id); return { name: d.name, total: rs.length, correct: rs.filter((r) => r.correct).length }; });
      pr.mocks.push({ date: today(), score: result.score });
      if (result.score >= 700) award(pr, "mock", result.badges);
    }
    saveProg();
    state.lastResult = result; state.session = null; state.view = "result"; render(); window.scrollTo(0, 0);
  }

        h("div", { class: "row spread", style: "align-items:flex-end" }, h("div", null, h("div", { class: "big" }, String(r.score)), h("span", { class: "muted small" }, "/ 1000点（目安） ・ 合格ライン 700")),
          h("span", { class: "chip " + (r.score >= 700 ? "good" : "warn") }, r.score >= 700 ? "合格ライン以上" : "合格ライン未満")),
        r.unanswered ? h("p", { class: "muted small" }, `時間切れなどで未回答が ${r.unanswered}問あり、不正解として計算しています。`) : null,
        r.byDomain.map((d) => h("div", { class: "domain-row" }, h("div", { class: "stack", style: "gap:4px" }, h("span", { class: "small" }, d.name), h("div", { class: "bar" }, h("i", { style: `width:${pct(d.correct, d.total)}%` }))), h("span", { class: "num small", style: "text-align:right" }, `${d.correct}/${d.total}`)))));
    }
    out.push(h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", null, `+${r.xp}`), h("span", null, "獲得 XP")),
      h("div", { class: "stat" }, h("b", null, `${pct(r.correct, r.total)}%`), h("span", null, `正解 ${r.correct}/${r.total}`)),
      h("div", { class: "stat" }, h("b", null, String(r.maxCombo)), h("span", null, "最大コンボ")),
      h("div", { class: "stat" }, h("b", null, `Lv${r.levelAfter}`), h("span", null, r.levelAfter > r.levelBefore ? "レベルアップ！" : levelTitle(r.levelAfter)))));
    if (r.kind === "boss") out.push(h("p", { class: "muted" }, r.bossWon ? "エリアにボス撃破の印が付きました。" : "5問中4問の正解で勝利です。苦手なステージの要点カードを見直してから再挑戦しましょう。"));
    if (r.quests.length || r.badges.length) out.push(h("section", { class: "panel" },
      r.quests.map((q) => h("div", { class: "row" }, h("span", { class: "chip good" }, "クエスト達成"), h("span", null, q))),
      r.badges.map((b) => { const bd = BADGES.find((x) => x.id === b); return bd ? h("div", { class: "row" }, h("span", { class: "chip accent" }, "新しいバッジ"), h("b", null, bd.name), h("span", { class: "muted small" }, bd.desc)) : null; })));
    const wrong = r.results.filter((x) => !x.correct);
    if (wrong.length) out.push(h("section", { class: "panel" }, h("h2", null, "間違えた問題"),
      [...new Set(wrong.map((w) => w.qid))].map((id) => { const q = pk.qById[id]; return h("details", null, h("summary", null, q.stem), h("p", { class: "small", style: "margin-top:6px" }, `正解：${q.answer.map((a) => q.options.find((o) => o.id === a).text).join(" ／ ")}`), h("p", { class: "small muted" }, q.explanation)); })));
    out.push(h("div", { class: "row" }, h("button", { class: "btn primary", onclick: () => setView("home") }, "マップに戻る"), h("button", { class: "btn", onclick: () => setView("progress") }, "進捗を見る")));
    return out;
  }

  function viewProgress() {
    const pk = pack(), pr = prog();
    if (!pk) return [h("div", { class: "panel empty" }, "学習中の資格がありません。")];
    const out = [h("div", { class: "stack", style: "gap:4px" }, h("div", { class: "eyebrow" }, pk.code), h("h1", null, "進捗"))];
    const o = overall(pk, pr);
    out.push(h("div", { class: "stats" },
      h("div", { class: "stat" }, h("b", null, String(pr.answered || 0)), h("span", null, "累計回答")),
      h("div", { class: "stat" }, h("b", null, `${o.seen}/${o.total}`), h("span", null, "挑戦した問題")),
      h("div", { class: "stat" }, h("b", null, String(pr.bestStreak)), h("span", null, "最長連続日数")),
      h("div", { class: "stat" }, h("b", null, String(pr.xp)), h("span", null, "総 XP"))));
    out.push(h("section", { class: "panel" }, h("div", { class: "row spread" }, h("h2", null, "領域ごとの状態"), h("span", { class: "muted small" }, "棒：定着 ・ 右：正答率")),
      pk.domains.map((d) => { const s = domainStats(pk, pr, d.id); return h("div", { class: "domain-row" },
        h("div", { class: "stack", style: "gap:4px" }, h("div", { class: "row spread small" }, h("span", null, d.name), h("span", { class: "muted num" }, `配点 ${d.weightMin}–${d.weightMax}%`)), h("div", { class: "bar" + (s.masteryPct >= 80 ? " good" : "") }, h("i", { style: `width:${s.masteryPct}%` }))),
        h("span", { class: "num small", style: "text-align:right" }, s.acc == null ? "—" : `${Math.round(s.acc * 100)}%`)); })));
    const weak = pk.topics.map((t) => ({ t, s: topicStats(pk, pr, t.id) })).filter((x) => x.s.attempts >= 2 && x.s.acc < 0.7).sort((a, b) => a.s.acc - b.s.acc).slice(0, 5);
    out.push(h("section", { class: "panel" }, h("h2", null, "苦手なステージ"),
      weak.length ? weak.map(({ t, s }) => h("div", { class: "row spread" }, h("span", null, t.title), h("div", { class: "row", style: "gap:6px" }, h("span", { class: "chip bad num" }, `正答率 ${Math.round(s.acc * 100)}%`), h("button", { class: "btn small", onclick: () => startSession("topic", buildTopic(pk, pr, t.id), { title: t.title }) }, "解き直す"))))
        : h("p", { class: "muted small" }, "正答率が70%未満のステージはまだありません。2回以上解いたステージから判定します。")));
    const t = today(), cells = [];
    const start = addDays(weekKey(t), -28);
    for (let i = 0; i < 35; i++) { const d = addDays(start, i); const a = pr.history[d]?.a || 0; const lv = a === 0 ? "" : a < 5 ? "l1" : a < 15 ? "l2" : "l3"; cells.push(h("i", { class: lv, title: `${d}：${a}問` })); }
    out.push(h("section", { class: "panel" }, h("div", { class: "row spread" }, h("h2", null, "学習カレンダー"), h("span", { class: "muted small" }, "直近5週 ・ 月曜はじまり")), h("div", { class: "heat", role: "img", "aria-label": "直近5週間の学習量" }, cells)));
    out.push(h("section", { class: "panel" }, h("h2", null, "バッジ"),
      h("div", { class: "badges" }, BADGES.map((b) => h("div", { class: "badge " + (pr.badges[b.id] ? "earned" : "locked") }, h("b", null, b.name), h("span", null, pr.badges[b.id] ? `${fmtDate(pr.badges[b.id])} 獲得` : b.desc))))));
    out.push(reportsPanel());
    if (pr.mocks.length) out.push(h("section", { class: "panel" }, h("h2", null, "模試の記録"), pr.mocks.slice(-5).reverse().map((m) => h("div", { class: "row spread small" }, h("span", null, fmtDate(m.date)), h("span", { class: "num" }, `${m.score}点`)))));
    return out;
  }

  function reportsPanel() {
    const list = (LS.get("reports") || []).filter((r) => r.status === "open");
    if (!list.length) return null;
    const text = () => list.map((r) => `[${r.certId} ${r.qid} v${r.packVersion}] ${r.note}`).join("\n");
    return h("section", { class: "panel" },
      h("div", { class: "row spread" }, h("h2", null, "誤りの報告"), h("span", { class: "chip warn num" }, `${list.length}件`)),
      list.map((r) => h("div", { class: "small" }, h("span", { class: "code" }, r.qid), " ", r.note)),
      h("div", { class: "row" },
        h("button", { class: "btn small", onclick: async () => { try { await navigator.clipboard.writeText("Certivo の問題の誤り報告です。\n" + text()); toast("コピーしました。チャットで Claude に送ってください"); } catch { toast("コピーできませんでした"); } } }, "まとめてコピー"),
        h("button", { class: "btn small ghost", onclick: () => { LS.set("reports", (LS.get("reports") || []).map((r) => ({ ...r, status: "sent" }))); render(); } }, "送ったので消す")));
  }

  /* ---------- render ---------- */
  function renderBar() {
    const bar = $("#bar"); bar.replaceChildren();
    const s = state.session; if (state.view !== "quiz" || !s) return;
    const q = curQ(); let btn;
    if (!s.answered) {
      if (q.type !== "multi") return;
      btn = h("button", { class: "btn primary", disabled: s.selected.length === 0, onclick: submit }, "回答する");
    } else btn = h("button", { class: "btn primary", onclick: next }, s.idx + 1 >= s.queue.length ? "結果を見る" : "次の問題へ");
    bar.append(h("div", { class: "actionbar" }, h("div", { class: "actionbar-in" }, h("span", { class: "muted small" }, h("span", { class: "kbd" }, "1–4"), " で選択 ・ ", h("span", { class: "kbd" }, "Enter"), " で決定"), btn)));
  }
  function render() {
    const app = $("#app");
    if (!state.ready) return;
    for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-current", (b.dataset.view === state.view || (b.dataset.view === "home" && ["quiz", "topic", "result"].includes(state.view))) ? "page" : "false");
    const views = { certs: viewCerts, home: viewHome, topic: viewTopic, quiz: viewQuiz, result: viewResult, progress: viewProgress };
    app.replaceChildren(...(views[state.view] || viewCerts)());
    renderBar();
    const sync = $("#sync");
    sync.replaceChildren(h("span", { class: "dot" + (Store.synced ? " on" : "") }), h("span", null, Store.synced ? "PC・スマホで同期中" : "この端末にだけ保存中"));
  }

  document.addEventListener("keydown", (e) => {
    if (state.view !== "quiz" || !state.session) return;
    if (e.target.closest && e.target.closest("input, textarea, select")) return;
    const s = state.session;
    if (!s.answered && /^[1-6]$/.test(e.key)) { const oid = s.order[Number(e.key) - 1]; if (oid) { e.preventDefault(); choose(oid); } }
    else if (e.key === "Enter") { e.preventDefault(); if (s.answered) next(); else if (s.selected.length) submit(); }
  });
  for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", async () => {
    const v = b.dataset.view;
    if ((v === "home" || v === "progress") && !pack()) { await loadPack(state.certId); }
    setView(v);
  });
  setInterval(() => { if (state.view === "quiz" && state.session?.kind === "mock") { const el = $("#timer"); if (el) { const m = Math.max(0, Math.round((state.session.endsAt - Date.now()) / 60000)); el.textContent = `残り${m}分`; if (Date.now() > state.session.endsAt && !state.session.answered) finishSession(); } } }, 15000);

  /* ---------- boot ---------- */
  async function boot() {
    state.profile = Object.assign(newProfile(), LS.get("profile") || {});
    try { await loadRegistry(); await loadPack("ai-103"); }
    catch { $("#app").replaceChildren(h("div", { class: "panel empty" }, "問題データを読み込めませんでした。ページを再読み込みしてください。")); return; }
    state.ready = true;
    state.view = state.profile.certs.some((c) => c.certId === "ai-103") ? "home" : "certs";
    render();
    const ok = await Store.connect();
    if (ok) {
      const rp = await Store.loadRemote("profile");
      const merged = newer(LS.get("profile"), rp); if (merged) state.profile = Object.assign(newProfile(), merged);
      for (const c of state.profile.certs) if (c.certId) {
        const rr = await Store.loadRemote("prog-" + c.certId);
        const m = newer(LS.get("prog-" + c.certId), rr);
        if (m) state.prog[c.certId] = Object.assign(newProg(), m);
        if (m && m !== rr) Store.save("prog-" + c.certId, state.prog[c.certId]);
        else if (m) LS.set("prog-" + c.certId, m);
      }
      if (merged && merged !== rp) saveProfile(); else if (merged) LS.set("profile", merged);
    }
    if (state.view !== "quiz") render(); else renderBar();
  }
  boot();
  getSample();

  if ("serviceWorker" in navigator && location.protocol !== "file:") {
    window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
  }
  let installEvt = null;
  const installBtn = $("#install");
  window.addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); installEvt = e; installBtn.hidden = false; });
  installBtn.addEventListener("click", async () => { if (!installEvt) return; installEvt.prompt(); await installEvt.userChoice.catch(() => {}); installEvt = null; installBtn.hidden = true; });
  window.addEventListener("appinstalled", () => { installBtn.hidden = true; toast("Certivo をインストールしました"); });
})();
</script>

</body>
